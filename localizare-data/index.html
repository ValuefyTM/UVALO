<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ece0">
<title>Localizator cadastral · UVALO</title>
<meta name="description" content="Caută un număr cadastral și vezi conturul pe hartă, inventarul de coordonate Stereo 70 / GPS și vecinii. UVALO — platformă pentru evaluatori.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: bară VALUEFY sus · panou fișă (stânga, desktop) + hartă; pe telefon hartă sus și fișa dedesubt, pagina derulează normal */
:root{
  --navy:#111111; --navy-deep:#000000; --navy-hover:#2a2a2a; --ink:#111111; --muted:#666666; --muted-2:#4a4a4a;
  --acc:#f2a93b; --acc-ink:#e0931a; --acc-soft:#fdf1dc; --acc-text:#9a5f00;
  --white:#ffffff; --cream:#fbf8f2; --cream-deep:#f7f1e4; --gray-bg:#f7f8fa; --line:#e7e9ed; --line-warm:#ede6d8; --header-bg:#f2ece0;
  --danger-soft:#fdecea; --danger-text:#a4281e;
  --sans:Verdana,Geneva,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --hdr:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--white);color:var(--ink);font:14px/1.55 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--acc-text)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.top{height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 20px 0;background:var(--header-bg);border-bottom:1px solid var(--line-warm);display:flex;align-items:center;gap:16px;position:relative;z-index:1000}
.top .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.top .logo img{height:26px;width:auto;display:block}
.top .logo span{font-size:12px;color:var(--muted);border-left:1px solid var(--line-warm);padding-left:12px;white-space:nowrap}
.top .cta{margin-left:auto;background:var(--acc);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;border-radius:999px;padding:9px 16px;white-space:nowrap;transition:background .25s var(--ease)}
.top .cta:hover{background:var(--acc-ink)}

.app{position:relative;display:grid;grid-template-columns:var(--side,420px) 1fr;grid-template-rows:auto 1fr auto;height:calc(100% - var(--hdr) - env(safe-area-inset-top,0px))}
aside{display:contents}
.find,main,.note{grid-column:1;border-right:1px solid var(--line);background:var(--white)}
.find{grid-row:1}main{grid-row:2}.note{grid-row:3}
.mapwrap{grid-column:2;grid-row:1/-1}
#map{min-width:0;min-height:0;background:var(--navy)}
/* Glisorul dintre panou și hartă: trage ca să lățești panoul (dublu clic: lățimea inițială) */
.split{position:absolute;top:0;bottom:0;left:calc(var(--side,420px) - 6px);width:12px;z-index:1200;cursor:col-resize;touch-action:none;background:none;border:0;padding:0}
.split::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:transparent;transition:background .2s var(--ease)}
.split::after{content:"";position:absolute;left:1px;top:50%;width:10px;height:46px;margin-top:-23px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.18);background-image:linear-gradient(90deg,transparent 3px,#bdbdbd 3px,#bdbdbd 4px,transparent 4px,transparent 5px,#bdbdbd 5px,#bdbdbd 6px,transparent 6px);transition:border-color .2s var(--ease)}
.split:hover::before,.split.drag::before,.split:focus-visible::before{background:var(--acc)}
.split:hover::after,.split.drag::after{border-color:var(--acc)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing #map{pointer-events:none}
/* Descărcarea fișei, în bara de sus */
.hx{margin-left:auto;display:flex;align-items:center;gap:6px}
.hx span{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px;white-space:nowrap}
.hx button{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-warm);background:#fff;color:var(--ink);font-weight:700;font-size:12.5px;cursor:pointer;transition:border-color .2s var(--ease)}
.hx button:hover:not(:disabled){border-color:var(--ink)}
.hx button:disabled{opacity:.45;cursor:not-allowed}
.top .hx~.vfBack{margin-left:4px}

.find{padding:18px 20px 16px;background-image:linear-gradient(var(--cream),var(--cream-deep));border-bottom:1px solid var(--line-warm);display:grid;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-text);margin:0}
.find h1{font-size:22px;line-height:1.15;letter-spacing:-.035em;margin:0;text-wrap:balance}
.row{display:flex;gap:8px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
form select,form input{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:0 12px;min-width:0}
form input{font:700 17px var(--mono);letter-spacing:.02em}
.stack{display:grid;gap:10px}
#judSel{width:132px}
.field.grow{flex:1}
.btn{height:46px;border-radius:12px;border:0;background:var(--acc);color:var(--ink);font-weight:700;padding:0 18px;cursor:pointer;transition:background .25s var(--ease)}
.btn:hover{background:var(--acc-ink)}
.btn2{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-weight:700;font-size:13px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:border-color .25s var(--ease)}
.btn2:hover{border-color:var(--acc)}
.btn2.navy{background:var(--navy);border-color:var(--navy);color:#f5f5f5}
.btn2.navy:hover{background:var(--navy-hover)}
#sugg{display:flex;flex-wrap:wrap;gap:6px}
#sugg:empty{display:none}
.chip{border:1px solid var(--line-warm);background:var(--white);border-radius:999px;font:700 12px var(--mono);padding:6px 10px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.hint{font-size:12px;color:var(--muted);margin:0}

main{overflow:auto;padding:18px 20px 24px;display:grid;gap:18px;align-content:start;min-height:0}
.empty{color:var(--muted-2);margin:0}
.idrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.idrow .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.idrow .id{font:800 28px var(--mono);letter-spacing:.01em;line-height:1.1}
.pill{background:var(--navy);color:#f5f5f5;border-radius:999px;font-size:12px;font-weight:700;padding:5px 11px;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--cream);border:1px solid var(--line-warm);border-radius:10px;padding:9px 11px;min-width:0}
.facts small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.facts b{display:block;font:800 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.flag{background:var(--danger-soft);color:var(--danger-text);border-radius:10px;padding:10px 12px;font-size:12.5px}
.flag .chip{margin:4px 4px 0 0}
h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-text);margin:0 0 8px}
.seg{display:inline-flex;background:var(--gray-bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tabs{margin:0;justify-self:start}
form input.txt{font:400 15px var(--sans);letter-spacing:0}
#rad{width:96px}
.near{display:grid;gap:6px}
.near button{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--white);border-radius:10px;padding:9px 12px;cursor:pointer;font:12.5px var(--mono);font-variant-numeric:tabular-nums;min-height:44px}
.near button:hover{border-color:var(--acc)}
.near button.here{background:var(--acc-soft);border-color:var(--acc)}
.near b{font-weight:800;font-size:14px}
.near span{color:var(--muted)}
.loc{background:var(--cream);border:1px solid var(--line-warm);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.loc b{font-size:14px}
.loc small{font:12px var(--mono);color:var(--muted)}
.back{justify-self:start;background:none;border:0;color:var(--acc-text);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font:12.5px var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:700 11px var(--sans);color:var(--muted);background:var(--gray-bg)}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:center}
td:first-child{font-weight:800}
tfoot td{background:var(--cream);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn2{justify-content:center}
.nb{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));margin:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-weight:700;z-index:900}
.mapwrap{position:relative;min-width:0;min-height:0}
.mapwrap #map{position:absolute;inset:0}
.gpsBtn{margin-top:8px;background:var(--white);color:var(--ink);border:1px solid var(--line,#e2d8c4);display:flex;align-items:center;justify-content:center;gap:8px}
.gpsBtn[aria-pressed="true"],.gpsCtl[aria-pressed="true"]{background:#111111;color:#fff;border-color:#111111}
.gpsCtl{position:absolute;left:10px;top:84px;z-index:500;width:34px;height:34px;border-radius:4px;border:2px solid rgba(0,0,0,.2);background:#fff;color:#111111;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;background-clip:padding-box}
.gpsBar{position:absolute;left:10px;right:10px;bottom:26px;z-index:600;background:#fff;color:#111111;border-radius:14px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:13px;line-height:1.5;max-height:45%;overflow:auto}
.gpsBar .sub{display:block;color:#6b6b6b;font-size:12px;margin-top:2px}
.gpsBar .acts{margin-top:7px}
.mapwrap:has(.gpsBar:not([hidden])) .legend{display:none}
.gpsBar b{font-family:var(--mono,ui-monospace,monospace)}
.gpsBar .ok{color:#157f55;font-weight:700}.gpsBar .no{color:#9a5f00;font-weight:700}
.gpsBar .acts{display:flex;gap:6px;flex-wrap:wrap}
.gpsBar button.pid{padding:2px 8px;margin:0 2px}
.gpsBar button[aria-pressed="true"]{background:#111111;border-color:#111111;color:#fff}
.gpsDotIco{background:none;border:0}.gpsDotIco .cone{transition:transform .15s linear}
.gpsBar button{font:inherit;font-size:12px;font-weight:700;padding:5px 10px;display:inline-block;border-radius:999px;border:1px solid #e2d8c4;background:#fbf8f2;color:#111111;cursor:pointer}
.gpsBar button.pid{background:#fdf1dc;border-color:#f5d9a6;font-family:var(--mono,ui-monospace,monospace)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#f5f5f5;padding:10px 16px;border-radius:12px;font-size:13px;z-index:2000;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.vx{font:800 11px var(--mono);color:var(--ink);background:var(--acc);border:1.5px solid var(--navy);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
.leaflet-tooltip.pl{font:700 12px var(--mono);color:var(--ink)}
.leaflet-container{font-family:var(--sans)}
.leaflet-control-layers label{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:12.5px}
.leaflet-control-layers input{margin:0}
.lb{white-space:nowrap;transform:translate(-50%,-50%);font:700 11px var(--mono);color:#fff;text-shadow:0 0 3px #000,0 0 2px #000,0 0 1px #000;pointer-events:none}
.lb.topo{color:#ffe082;font-size:10.5px;font-weight:600}
.lb.cb{color:#fff;font-size:10px}
.blist{display:grid;gap:6px}
.blist button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--white);border-radius:10px;padding:8px 12px;cursor:pointer;font:12.5px var(--mono);min-height:44px;text-align:left}
.blist button:hover{border-color:var(--acc)}
.blist i{width:12px;height:12px;border-radius:3px;background:#e3262e;border:1px solid #9e1218}
.blist span{color:var(--muted)}
.info{background:var(--cream);border:1px solid var(--line-warm);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--muted-2)}
.info b{color:var(--ink)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{border:1px solid var(--line-warm);background:var(--cream);border-radius:999px;font:600 12px var(--mono);padding:5px 10px}
.legend{position:absolute;left:10px;bottom:28px;z-index:800;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--ink);display:flex;gap:10px;flex-wrap:wrap;box-shadow:0 8px 20px -12px rgba(0,0,0,.5);max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.leaflet-bar a{color:var(--ink)}

@media (max-width:820px){
  :root{--hdr:56px}
  .top{padding-inline:16px;gap:10px}
  .top .logo img{height:22px}
  .top .logo span{display:none}
  .split{display:none}
  .hx{gap:4px}.hx span{display:none}.hx button{height:32px;padding:0 9px;font-size:12px}
  .top .vfBack{font-size:0!important;padding:6px 9px!important}.top .vfBack::before{content:"← Tools";font-size:12px}
  .top .cta{padding:8px 12px;font-size:12px}
  html,body{height:auto}
  .app{display:block;height:auto}
  .find,main,.note{border-right:0}
  .find{padding:14px 16px;gap:10px}
  .find h1{font-size:19px}
  #judSel{width:120px;padding:0 8px;font-size:13px}
  .mapwrap{height:52svh;min-height:300px}
  main{overflow:visible;padding:16px 16px 20px}
  .note{padding-inline:16px}
  .actions{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){
  .facts{grid-template-columns:1fr 1fr}
  .facts div:last-child{grid-column:1/-1}
  .actions{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/" aria-label="UVALO — pagina principală"><img src="/uvalo-logo-ink.svg" alt="UVALO" width="923" height="228"><span>Localizator cadastral</span></a>
  <div class="hx" id="hx" role="group" aria-label="Descarcă fișa de localizare"></div>
</header>

<div class="app">
  <aside>
    <form class="find" id="f" autocomplete="off">
      <p class="eyebrow" id="eyebrow">Hartă cadastrală</p>
      <h1>Găsește un imobil după număr cadastral, topo sau adresă.</h1>
      <div class="seg tabs" role="tablist" aria-label="Tip căutare"><button type="button" role="tab" id="tabCad" aria-pressed="true">Nr. cadastral</button><button type="button" role="tab" id="tabAdr" aria-pressed="false">Adresă / coordonate</button></div>
      <div class="stack" id="modeCad">
        <div class="row">
          <div class="field"><label for="judSel">Județ</label><select id="judSel"></select></div>
          <div class="field grow"><label for="uatSel">UAT</label><select id="uatSel"></select></div>
        </div>
        <div class="field"><label for="q">Nr. cadastral sau topo</label><input id="q" inputmode="text" autocapitalize="off" enterkeyhint="search" placeholder="ex. 405306 sau 247/2/1/1/2/6"></div>
      </div>
      <div class="row" id="modeAdr" hidden>
        <div class="field grow"><label for="addr">Adresă, coordonate sau link Google Maps</label><input id="addr" class="txt" enterkeyhint="search" placeholder="ex. Str. Aron Gabor, Dumbrăvița"></div>
        <div class="field"><label for="rad">Rază</label><select id="rad"><option value="50">50 m</option><option value="100" selected>100 m</option><option value="250">250 m</option></select></div>
      </div>
      <button class="btn" type="submit">Caută →</button>
      <button class="btn gpsBtn" type="button" id="gpsBtn" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg><span>Unde sunt? Folosește locația mea</span></button>
      <div id="sugg"></div>
      <p class="hint" id="hint">Sau atinge o parcelă pe hartă.</p>
    </form>
    <div class="mapwrap"><div id="map" role="region" aria-label="Hartă"></div><div class="loading" id="load" hidden>Se încarcă…</div><div class="legend" id="legend" hidden></div><button type="button" class="gpsCtl" id="gpsMap" aria-label="Locația mea" title="Locația mea"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button><div class="gpsBar" id="gpsBar" role="status" aria-live="polite" hidden></div></div>
    <main id="out" aria-live="polite"><p class="empty">Alege UAT-ul și introdu numărul cadastral din extrasul CF. Vezi conturul pe imaginea satelit, inventarul de coordonate și vecinii.</p></main>
    <p class="note" id="foot" hidden></p>
  </aside>
  <button type="button" class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Lățimea panoului (trage sau folosește săgețile)" title="Trage ca să lățești panoul · dublu clic: lățimea inițială"></button>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Stereo 70 (EPSG:31700, stereografic dublu pe Krasovski) -> WGS84, Helmert 7 parametri (convenția PROJ towgs84). */
const S70=(()=>{
  const D=Math.PI/180, a=6378245, f=1/298.3, e2=2*f-f*f, e=Math.sqrt(e2);
  const lat0=46*D, lon0=25*D, k0=0.99975, FE=500000, FN=500000;
  const s0=Math.sin(lat0), c0=Math.cos(lat0);
  const rho0=a*(1-e2)/Math.pow(1-e2*s0*s0,1.5), nu0=a/Math.sqrt(1-e2*s0*s0), R=Math.sqrt(rho0*nu0);
  const n=Math.sqrt(1+e2*Math.pow(c0,4)/(1-e2));
  const S1=(1+s0)/(1-s0), S2=(1-e*s0)/(1+e*s0), w1=Math.pow(S1*Math.pow(S2,e),n);
  const sx0=(w1-1)/(w1+1), c=(n+s0)*(1-sx0)/((n-s0)*(1+sx0)), w2=c*w1, chi0=Math.asin((w2-1)/(w2+1));
  const g=2*R*k0*Math.tan(Math.PI/4-chi0/2), h=4*R*k0*Math.tan(chi0)+g;
  const T=[2.329,-147.042,-92.08], rs=[-0.309,0.325,0.497].map(x=>x/3600*D), sc=1+5.69e-6;
  const A=6378137, F=1/298.257223563, E2=2*F-F*F, B=A*(1-F), EP2=(A*A-B*B)/(B*B);
  /* E = Y Stereo (est), N = X Stereo (nord) */
  return function(E,N){
    const dE=E-FE, dN=N-FN;
    const i=Math.atan(dE/(h+dN)), j=Math.atan(dE/(g-dN))-i;
    const chi=chi0+2*Math.atan((dN-dE*Math.tan(j/2))/(2*R*k0));
    const Lam=j+2*i+lon0, lon=(Lam-lon0)/n+lon0;
    const sc_=Math.sin(chi), psi=0.5*Math.log((1+sc_)/(c*(1-sc_)))/n;
    let phi=2*Math.atan(Math.exp(psi))-Math.PI/2;
    for(let k=0;k<10;k++){const sp=Math.sin(phi);
      const psii=Math.log(Math.tan(phi/2+Math.PI/4)*Math.pow((1-e*sp)/(1+e*sp),e/2));
      const nx=phi-(psii-psi)*Math.cos(phi)*(1-e2*sp*sp)/(1-e2); if(Math.abs(nx-phi)<1e-14){phi=nx;break} phi=nx}

function centroidW(o){let A=0,x=0,y=0;const w=o.w,a0=w[0][0],b0=w[0][1];for(let i=0,j=w.length-1;i<w.length;j=i++){const pa=w[j][0]-a0,pb=w[j][1]-b0,qa=w[i][0]-a0,qb=w[i][1]-b0,f=pb*qa-qb*pa;A+=f;x+=(pb+qb)*f;y+=(pa+qa)*f}
  if(Math.abs(A)<1e-16){return[(o.bb[0]+o.bb[2])/2,(o.bb[1]+o.bb[3])/2]}return[a0+y/(3*A),b0+x/(3*A)]}
const normT=s=>s.toLowerCase().replace(/^\s*(nr\.?\s*)?top(o)?\.?\s*/,'').replace(/\s+/g,'').replace(/;/g,',');
async function getData(u){
  if(cache[u.key])return cache[u.key];
  try{
    const D=await fetch(u.file).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
    D.parcels.forEach((p,i)=>{p.i=i;if(p.z){p.s=dec(p.z);delete p.z}prep(p)});
    D.B=(D.b||[]).map(r=>{const o={c:r[0],p:r[1],s:dec(r[2])};prep(o);o.a=area(o.s);o.cc=o.c?centroidW(o):null;return o});
    D.B.forEach((b,k)=>{b.k=k;if(b.p>=0)(D.parcels[b.p].bs=D.parcels[b.p].bs||[]).push(b)});
    D.parcels.forEach(p=>{if(p.bs)p.bs.sort((a,b)=>(+a.c.slice(1))-(+b.c.slice(1)))});
    D.TP=(D.t||[]).map(r=>({t:r[0],s:[r[1],r[2]],p:r[3],w:S70w(r[1],r[2]),n:normT(r[0])}));
    D.IV=(D.iv||[]).map(r=>({name:r[0],w:dec(r[1]).map(s=>S70w(s[0],s[1]))}));
    return cache[u.key]=D;
  }catch(e){return null}
}
async function loadUat(key){

  P=D.parcels; BL=D.B; TP=D.TP; byId=new Map(); P.forEach((p,i)=>{(byId.get(p.id)||byId.set(p.id,[]).get(p.id)).push(p)});

  P.forEach((p,i)=>{if(p.o)ls[i].addTo(all)});P.forEach((p,i)=>{if(!p.o)ls[i].addTo(all)});

  BL.forEach(b=>{const l=L.polygon(b.w,bst);l.on('click',ev=>{L.DomEvent.stopPropagation(ev);showBuilding(b,true)});l.addTo(bL)});
  D.IV.forEach(v=>L.polygon(v.w,{color:'#2bd4c4',weight:2,dashArray:'6 5',fill:false,interactive:false}).bindTooltip(v.name).addTo(ivL));

let searchMode='cad', lastNear=null; const locLayer=L.layerGroup().addTo(map);
function parseCoords(s){
  let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||s.match(/^\s*(-?\d{1,2}[.,]\d+)\s*[,; ]\s*(-?\d{1,3}[.,]\d+)\s*$/);
  if(!m)return null; const a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[2].replace(',','.'));
  return (a>43&&a<49&&b>20&&b<30)?[a,b]:null;
}
async function geocode(s){
  const out=[];
  // Google, prin serverul tools (cheia nu ajunge în pagină pentru căutare); 204 = Google nu e configurat.
  try{
    const r=await fetch('/api/localizare/geocode?q='+encodeURIComponent(s));
    if(r.status===200){(await r.json()).forEach(x=>{if(inArea(x.lat,x.lng))out.push(x)}); if(out.length)return out}
  }catch(e){}
  try{
    const r=await fetch('https://photon.komoot.io/api/?limit=6&lat='+((AREA.s+AREA.n)/2).toFixed(2)+'&lon='+((AREA.w+AREA.e)/2).toFixed(2)+'&bbox='+[AREA.w,AREA.s,AREA.e,AREA.n].map(x=>x.toFixed(2)).join(',')+'&q='+encodeURIComponent(s));
    const j=await r.json();
    (j.features||[]).forEach(f=>{const p=f.properties||{};const c=f.geometry.coordinates;
      const lab=[[p.street||p.name,p.housenumber].filter(Boolean).join(' '),p.city||p.town||p.village||p.county].filter(Boolean).join(', ');
      if(inArea(c[1],c[0]))out.push({lat:c[1],lng:c[0],label:lab||p.name||s})});
  }catch(e){}
  if(!out.length){try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ro&viewbox='+[AREA.w,AREA.n,AREA.e,AREA.s].map(x=>x.toFixed(2)).join(',')+'&bounded=1&q='+encodeURIComponent(s));
    (await r.json()).forEach(x=>out.push({lat:+x.lat,lng:+x.lon,label:x.display_name.split(',').slice(0,3).join(',')}));
  }catch(e){}}
  return out;
}
async function addrSearch(s){
  if(!s)return;
  const c=parseCoords(s);
  if(c)return goToPoint(c[0],c[1],'Coordonate '+c[0].toFixed(6)+', '+c[1].toFixed(6),[]);
  $('out').innerHTML='<p class="empty">Caut adresa…</p>';
  const res=await geocode(s);
  if(!res.length){$('out').innerHTML='<div class="flag">Nu am găsit adresa „'+esc(s)+'”. Încearcă doar strada și localitatea (fără număr), sau lipește coordonatele / link-ul locației din Google Maps.</div>';return}
  goToPoint(res[0].lat,res[0].lng,res[0].label,res);
}
const inBB=(bb,la,lo,m)=>la>=bb[0]-m&&la<=bb[2]+m&&lo>=bb[1]-m&&lo<=bb[3]+m;
function distM(p,la,lo){ // 0 dacă punctul e în parcelă, altfel distanța minimă la contur, în metri
  const kx=Math.cos(la*Math.PI/180)*111320,ky=110540, pts=p.w.map(w=>[(w[1]-lo)*kx,(w[0]-la)*ky]);
  let inside=false,dmin=Infinity;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if(((yi>0)!==(yj>0))&&(0<(xj-xi)*(0-yi)/(yj-yi)+xi))inside=!inside;
    const dx=xj-xi,dy=yj-yi,l2=dx*dx+dy*dy;let t=l2?-(xi*dx+yi*dy)/l2:0;t=Math.max(0,Math.min(1,t));dmin=Math.min(dmin,Math.hypot(xi+t*dx,yi+t*dy))}
  return inside?0:dmin;
}
async function goToPoint(la,lo,label,alts){
  locLayer.clearLayers(); sel.clearLayers();
  const cands=UATS.filter(u=>inBB(u.bb,la,lo,0.002)); let u=null,bd=Infinity;
  if(cands.length>1||(cands.length&&!cache[cands[0].key]))$('load').hidden=false;
  for(const c of cands){const D=await getData(c);if(!D)continue;
    for(const p of D.parcels){if(!inBB(p.bb,la,lo,0.004))continue;const d=distM(p,la,lo);if(d<bd){bd=d;u=c}}}
  $('load').hidden=true;
  const R=+$('rad').value;
  L.circle([la,lo],{radius:R,color:'#ffffff',weight:2,dashArray:'5 5',fill:false,interactive:false}).addTo(locLayer);
  L.circleMarker([la,lo],{radius:8,color:'#111111',weight:3,fillColor:'#f2a93b',fillOpacity:1,interactive:false}).addTo(locLayer);
  if(!u){lastNear=null;map.setView([la,lo],17,{animate:false});
    $('out').innerHTML='<div class="loc"><b>'+esc(label)+'</b><small>'+la.toFixed(6)+', '+lo.toFixed(6)+'</small></div><div class="flag">Locația e în afara UAT-urilor disponibile ('+UATS.map(u=>u.name).join(', ')+').</div>';return}
  await loadUat(u.key);

  P.forEach(p=>{if(!inBB(p.bb,la,lo,dm))return;const d=distM(p,la,lo);if(d<=R)near.push({p,d})});
  near.sort((a,b)=>a.d-b.d||a.p.a-b.p.a);
  lastNear={lat:la,lng:lo,label,alts:alts||[],near,uat:u.name,ids:new Set(near.map(n=>n.p.id))};
  renderNear(); scrollToMap();
}

function geom(p){const s=p.s,n=s.length,seg=[];let per=0;for(let k=0;k<n;k++){const a=s[k],b=s[(k+1)%n],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push(d);per+=d}return{seg,per}}

  h+='<p class="hint">Conturul e amprenta la sol din planul cadastral (strat ConstructiiE3). Numerotarea C1, C2… e făcută după mărime și poate diferi de cea din extrasul CF.</p>';

/* ---------- Căutare după nr. topo ---------- */
let lastTopo=null, backTo=null;
function topoSearch(q){
  const n=normT(q); if(n.length<2)return;
  const seen=new Set(), ex=[], pa=[];
  for(const t of TP){const parts=t.n.split(','), exact=parts.includes(n)||t.n===n;
    if(!exact&&!t.n.includes(n))continue;
    const k=t.n+'|'+(t.p>=0?t.p:Math.round(t.s[0])+','+Math.round(t.s[1]));
    if(seen.has(k))continue; seen.add(k); (exact?ex:pa).push(t)}
  lastTopo={q,res:ex.concat(pa),nex:ex.length}; renderTopo();
}
function renderTopo(){
  const T=lastTopo; if(!T)return; backTo=null; lastNear=null; sel.clearLayers(); locLayer.clearLayers();
  const res=T.res.slice(0,150);
  res.forEach((t,k)=>L.circleMarker(t.w,{radius:k<T.nex?7:5,color:'#111111',weight:2,fillColor:k<T.nex?'#ffd21f':'#ffe9a8',fillOpacity:1,interactive:false}).addTo(locLayer));
  if(res.length)map.fitBounds(L.latLngBounds(res.map(t=>t.w)).pad(.3),{maxZoom:19,animate:false});
  let h='<div class="loc"><b>Nr. topo „'+esc(T.q)+'”</b><small>'+(T.res.length?T.res.length+' rezultate în '+esc(U.name)+(T.nex?' · '+T.nex+' potriviri exacte':''):'niciun rezultat')+'</small></div>';
  if(!T.res.length)h+='<div class="flag">Numărul nu apare în adnotările planului pentru '+esc(U.name)+'. Numerele topo sunt scrise doar parțial în plan. Încearcă o parte a numărului (de exemplu doar „247/2/1/1/2”) sau verifică localitatea.</div>';
  else h+='<div class="near">'+res.map((t,k)=>{const p=t.p>=0?P[t.p]:null;
      return '<button type="button" data-tk="'+k+'"'+(k<T.nex?' class="here"':'')+'><b style="font-size:12.5px;overflow-wrap:anywhere">'+esc(t.t)+'</b><span>'+(p?'nr. cad. '+esc(p.id):'fără nr. cad. nou')+'</span><span>→</span></button>'}).join('')+'</div>'+
    (T.res.length>150?'<p class="hint">Primele 150 de rezultate. Scrie numărul mai complet ca să restrângi lista.</p>':'')+
    '<p class="hint">Numerele topo provin din adnotările planului (recepții, PUZ-uri, dezmembrări) și sunt orientative. Numărul corect e cel din extrasul CF.</p>';
  $('out').innerHTML=h;
  $('out').querySelectorAll('[data-tk]').forEach(b=>b.onclick=()=>{const t=res[+b.dataset.tk];
    if(t.p>=0){show(P[t.p].id,t.p,true);backTo={label:'← Înapoi la rezultatele topo',fn:renderTopo};addBack();
      L.circleMarker(t.w,{radius:7,color:'#111111',weight:2,fillColor:'#ffd21f',fillOpacity:1,interactive:false}).bindTooltip(t.t,{permanent:true,direction:'top',className:'pl'}).addTo(sel)}
    else{goToPoint(t.w[0],t.w[1],'Nr. topo '+t.t+' (fără nr. cadastral nou)',[]).then(()=>{backTo={label:'← Înapoi la rezultatele topo',fn:renderTopo};addBack()})}});
}
function addBack(){if(!backTo)return;const b=document.createElement('button');b.type='button';b.className='back';b.textContent=backTo.label;const fn=backTo.fn;b.onclick=()=>fn();$('out').prepend(b)}
function scrollToMap(){if(matchMedia('(max-width:820px)').matches)document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth',block:'start'})}
function copy(o){
  const p=o||cur,g=geom(p),A=p.a;
  const rows=['Pct.\tX [m]\tY [m]\tLatitudine\tLongitudine\tD(i,i+1) [m]'].concat(p.s.map((s,k)=>[k+1,s[1].toFixed(3),s[0].toFixed(3),p.w[k][0].toFixed(7),p.w[k][1].toFixed(7),g.seg[k].toFixed(3)].join('\t')));
  rows.push('S = '+fmt(A,2)+' mp\tP = '+fmt(g.per,3)+' m');
  const txt=rows.join('\n');
  const fb=()=>{const t=document.createElement('textarea');t.value=txt;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{document.execCommand('copy');toast('Tabel copiat')}catch(e){toast('Copierea nu e permisă în acest browser')}t.remove()};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Tabel copiat. Lipește-l în Excel sau Word.')).catch(fb);else fb();
}
function gjson(p){const r=p.w.map(w=>[w[1],w[0]]);r.push(r[0]);return{type:'FeatureCollection',features:[{type:'Feature',properties:{nr_cadastral:p.id,uat:U.name,suprafata_mp:p.a,stereo70:p.s.map(s=>({X:s[1],Y:s[0]}))},geometry:{type:'Polygon',coordinates:[r]}}]}}
function kml(p,name){

  const pts=p.w.map((w,k)=>'<Placemark><name>'+(k+1)+'</name><description>X='+p.s[k][1].toFixed(3)+' Y='+p.s[k][0].toFixed(3)+'</description><Point><coordinates>'+w[1]+','+w[0]+',0</coordinates></Point></Placemark>').join('');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+esc(name)+'</name><Style id="p"><LineStyle><color>ff3ba9f2</color><width>3</width></LineStyle><PolyStyle><color>403ba9f2</color></PolyStyle></Style><Placemark><name>'+esc(name)+'</name><styleUrl>#p</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>'+r+'</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>'+pts+'</Document></kml>';
}
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

});
/* ---------- Locația mea (GPS): punct live pe hartă și parcela pe care stai ---------- */
const gpsL=L.layerGroup().addTo(map); let gpsWatch=null, gpsFirst=true, gpsPos=null, gpsFollow=true, gpsDot=null, gpsAcc=null;
/* Busola: direcția în care e îndreptat telefonul (con pe punctul albastru). iPhone cere permisiune la prima atingere. */
let compassOn=false, heading=null, headSrc='', compassRaf=0;
const DIRS=['N','NE','E','SE','S','SV','V','NV'];
const dirName=h=>DIRS[Math.round(h/45)%8];
function gpsIcon(){return L.divIcon({className:'gpsDotIco',iconSize:[96,96],iconAnchor:[48,48],
  html:'<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="gcg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#111111" stop-opacity=".85"/><stop offset="1" stop-color="#111111" stop-opacity=".05"/></linearGradient></defs><g class="cone" style="transform-origin:48px 48px;display:none"><path d="M48 48 L27 4 A46 46 0 0 1 69 4 Z" fill="url(#gcg)" stroke="#ffffff" stroke-opacity=".6" stroke-width="1"/></g><circle cx="48" cy="48" r="9" fill="#111111" stroke="#fff" stroke-width="3"/></svg>'})}
function drawHeading(){
  compassRaf=0; const el=gpsDot&&gpsDot.getElement(); if(!el)return; const c=el.querySelector('.cone');
  const h=compassOn?heading:(gpsPos&&gpsPos.course!=null?gpsPos.course:null);
  if(h==null){c.style.display='none';return}
  c.style.display='';c.style.transform='rotate('+h+'deg)';
  const t=document.getElementById('gpsHead'); if(t)t.textContent=dirName(h)+' '+Math.round(h)+'°'; else if(gpsPos&&!$('gpsBar').hidden)gpsBar();
}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading; // iPhone: față de nordul magnetic
  else if(e.absolute&&e.alpha!=null)h=360-e.alpha; // Android: deviceorientationabsolute
  if(h==null)return;
  const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  heading=(h+so+360)%360; headSrc='busolă';
  if(!compassRaf)compassRaf=requestAnimationFrame(drawHeading);
}
async function compassStart(){
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted'){compassOn=false;toast('Fără acces la busolă (senzori de mișcare).');return false}}}catch(e){compassOn=false;return false}
  if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onOrient);
  else window.addEventListener('deviceorientation',onOrient);
  compassOn=true; setTimeout(()=>{if(compassOn&&heading==null){toast('Busola nu răspunde pe acest dispozitiv.')}gpsBar()},2500); return true;
}
function compassStop(){compassOn=false;heading=null;window.removeEventListener('deviceorientationabsolute',onOrient);window.removeEventListener('deviceorientation',onOrient);drawHeading()}
function gpsState(on){[$('gpsBtn'),$('gpsMap')].forEach(b=>b.setAttribute('aria-pressed',on));$('gpsBtn').querySelector('span').textContent=on?'Oprește locația mea':'Unde sunt? Folosește locația mea'}
function gpsStop(){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gpsPos=null;gpsL.clearLayers();gpsDot=gpsAcc=null;compassStop();$('gpsBar').hidden=true;gpsState(false)}
function gpsStart(){
  if(!navigator.geolocation){toast('Browserul nu oferă locația.');return}
  gpsFirst=true;gpsFollow=true;gpsState(true);
  compassStart(); // în același gest de atingere (cerut de iPhone)
  const bar=$('gpsBar');bar.hidden=false;bar.innerHTML='<span>Caut locația… Acceptă accesul la locație dacă browserul îl cere.</span>';
  gpsWatch=navigator.geolocation.watchPosition(onGps,onGpsErr,{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
}
function onGpsErr(e){
  const m=e.code===1?'Accesul la locație este blocat. Permite-l din setările browserului (iconița de lângă adresă) și încearcă din nou.':e.code===3?'Locația nu a putut fi obținută la timp. Ieși în aer liber sau încearcă din nou.':'Locația nu este disponibilă acum.';
  $('gpsBar').hidden=false;$('gpsBar').innerHTML='<span>'+m+'</span><div class="acts"><button type="button" data-g="stop">Închide</button></div>';
  if(e.code===1){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gpsState(false)}
}
async function onGps(pos){
  const la=pos.coords.latitude, lo=pos.coords.longitude, acc=Math.max(1,Math.round(pos.coords.accuracy));
  const course=pos.coords.heading!=null&&!isNaN(pos.coords.heading)&&(pos.coords.speed||0)>0.8?pos.coords.heading:null; // direcția de mers, când nu e busolă
  gpsPos={la,lo,acc,course};
  if(!gpsDot){gpsAcc=L.circle([la,lo],{radius:acc,color:'#111111',weight:1,fillColor:'#111111',fillOpacity:.12,interactive:false}).addTo(gpsL);
    gpsDot=L.marker([la,lo],{icon:gpsIcon(),interactive:false,keyboard:false,zIndexOffset:1000}).addTo(gpsL)}
  else{gpsAcc.setLatLng([la,lo]).setRadius(acc);gpsDot.setLatLng([la,lo])}
  drawHeading();
  if(gpsFirst){gpsFirst=false;await goToPoint(la,lo,'Locația mea (±'+acc+' m)',[]);locLayer.clearLayers();map.setView([la,lo],Math.max(map.getZoom(),18),{animate:false})}
  else if(gpsFollow&&!map.getBounds().pad(-0.2).contains([la,lo]))map.panTo([la,lo]);
  gpsBar();
}
function edgeM(p,la,lo){ // distanța în metri de la punct la conturul parcelei (aproximare locală)
  const kx=Math.cos(la*Math.PI/180)*111320, ky=110540; let m=Infinity; const w=p.w;
  for(let i=0,j=w.length-1;i<w.length;j=i++){const ax=(w[j][1]-lo)*kx,ay=(w[j][0]-la)*ky,bx=(w[i][1]-lo)*kx,by=(w[i][0]-la)*ky;
    const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/((dx*dx+dy*dy)||1)));m=Math.min(m,Math.hypot(ax+t*dx,ay+t*dy))}
  return m}
function gpsBar(){
  const g=gpsPos; if(!g)return;
  let h='';
  const inUat=U&&P.length&&UATS.some(u=>u.key===U.key&&inBB(u.bb,g.la,g.lo,0.002));
  if(!inUat){h='<span class="no">Nu ești într-o localitate încărcată pe hartă.</span>'}
  else{
    const cand=P.filter(p=>inBB(p.bb,g.la,g.lo,0.0015));
    const here=cand.filter(p=>distM(p,g.la,g.lo)===0);
    if(here.length){h='<span class="ok">Ești pe parcela</span> '+[...new Set(here.map(p=>p.id))].map(id=>'<button type="button" class="pid" data-pid="'+esc(id)+'">'+esc(id)+'</button>').join(' ')+' <span>· '+esc(U.name)+'</span>';
      const e=edgeM(here[0],g.la,g.lo);
      if(e<g.acc)h+='<span class="sub">La '+fmt(e,0)+' m de limită, sub precizia GPS: poți fi și pe parcela vecină.</span>'}
    else{const nn=cand.map(p=>({p,d:distM(p,g.la,g.lo)})).sort((a,b)=>a.d-b.d)[0];
      h='<span class="no">Nu ești pe o parcelă înscrisă</span> <span>(drum sau imobil neînscris).</span>'+(nn&&nn.d<60?' <span>Cea mai apropiată:</span> <button type="button" class="pid" data-pid="'+esc(nn.p.id)+'">'+esc(nn.p.id)+'</button> <span>la '+fmt(nn.d,0)+' m</span>':'')}
  }
  const hd=compassOn&&heading!=null?heading:(g.course!=null?g.course:null);
  h+='<span class="sub">Precizie GPS ±'+g.acc+' m'+(g.acc>25?' — slabă, ieși în aer liber':'')+(hd!=null?' · direcție <b id="gpsHead">'+dirName(hd)+' '+Math.round(hd)+'°</b>'+(compassOn?'':' (de mers)'):'')+'</span>';
  h+='<div class="acts"><button type="button" data-g="center">Centrează</button><button type="button" data-g="compass" aria-pressed="'+compassOn+'">Busolă: '+(compassOn?'pornită':'oprită')+'</button><button type="button" data-g="here">Parcele în jur</button><button type="button" data-g="stop">Oprește</button></div>';
  const bar=$('gpsBar');bar.hidden=false;bar.innerHTML=h;
}
$('gpsBar').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pid){const list=byId.get(b.dataset.pid);if(list){gpsFollow=false;$('q').value=b.dataset.pid;show(b.dataset.pid,list[0].i,true)}return}
  if(b.dataset.g==='stop')return gpsStop();
  if(b.dataset.g==='compass'){if(compassOn)compassStop();else await compassStart();return gpsBar()}
  if(!gpsPos)return;
  if(b.dataset.g==='center'){gpsFollow=true;map.setView([gpsPos.la,gpsPos.lo],Math.max(map.getZoom(),18))}
  if(b.dataset.g==='here'){await goToPoint(gpsPos.la,gpsPos.lo,'Locația mea (±'+gpsPos.acc+' m)',[]);locLayer.clearLayers();gpsBar()}
});
map.on('dragstart',()=>{gpsFollow=false});
const gpsToggle=()=>gpsWatch!==null?gpsStop():gpsStart();
$('gpsBtn').onclick=gpsToggle;$('gpsMap').onclick=e=>{L.DomEvent.stopPropagation(e);gpsToggle()};

function setMode(m){searchMode=m;$('tabCad').setAttribute('aria-pressed',m==='cad');$('tabAdr').setAttribute('aria-pressed',m==='adr');$('modeCad').hidden=m!=='cad';$('modeAdr').hidden=m!=='adr';sugg.innerHTML='';(m==='cad'?q:$('addr')).focus()}

$('rad').onchange=()=>{if(lastNear)goToPoint(lastNear.lat,lastNear.lng,lastNear.label,lastNear.alts)};

(async()=>{
  const m=decodeURIComponent(location.hash.slice(1)).match(/^([a-z-]+?)(?:-(\d+))?$/);

  else{map.fitBounds(L.featureGroup(hullL.getLayers()).getBounds(),{animate:false});
    $('hint').textContent=(COUNTIES.length>1?COUNTIES.length+' județe, ':'')+UATS.length+' localități, '+UATS.reduce((s,u)=>s+u.n,0).toLocaleString('ro-RO')+' imobile. Alege localitatea din listă sau de pe hartă.';
    $('foot').textContent='Sursă: planuri cadastrale ANCPI / OCPI '+COUNTIES.join(', ')+'. Informațiile au caracter orientativ și nu înlocuiesc extrasul de carte funciară sau documentația cadastrală.';
    $('out').innerHTML='<p class="empty">Alege localitatea din listă sau dă clic pe ea pe hartă, apoi caută numărul cadastral. Poți căuta și după adresă, fără să alegi localitatea.</p>'}
})();

<script>
/* Lățimea panoului din stânga: glisorul dintre panou și hartă (mouse, deget, săgeți), ținută minte pe acest dispozitiv. */
(()=>{
  const app=document.querySelector('.app'), sp=document.getElementById('split'), DEF=420, KEY='vf-loc-side';
  const max=()=>Math.max(DEF,Math.round(app.clientWidth*.75)), clamp=w=>Math.max(320,Math.min(max(),Math.round(w)));
  let w=DEF; try{w=+localStorage.getItem(KEY)||DEF}catch(e){}
  let raf=0;
  const set=(v,save)=>{w=clamp(v);app.style.setProperty('--side',w+'px');sp.setAttribute('aria-valuenow',w);
    cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>map.invalidateSize({pan:false}));
    if(save)try{localStorage.setItem(KEY,String(w))}catch(e){}};
  set(w);
  sp.addEventListener('pointerdown',e=>{
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('drag'); document.body.classList.add('resizing');
    const x0=e.clientX, w0=w;
    const mv=ev=>set(w0+ev.clientX-x0);
    const up=()=>{sp.removeEventListener('pointermove',mv);sp.removeEventListener('pointerup',up);sp.removeEventListener('pointercancel',up);
      sp.classList.remove('drag');document.body.classList.remove('resizing');set(w,true)};
    sp.addEventListener('pointermove',mv);sp.addEventListener('pointerup',up);sp.addEventListener('pointercancel',up);
  });
  sp.addEventListener('dblclick',()=>set(DEF,true));
  sp.addEventListener('keydown',e=>{const d=e.key==='ArrowLeft'?-40:e.key==='ArrowRight'?40:0;if(d){e.preventDefault();set(w+d,true)}});
  addEventListener('resize',()=>set(w));
})();
</script>
