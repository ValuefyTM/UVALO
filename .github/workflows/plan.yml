# Cadastral plans uploaded from the admin panel (Planuri cadastrale), started by the Tools worker (src/lib/plans.ts):
#   convert: the compressed DXF (an asset of the draft release "plan-uploads") → tools/dxf/convert.py → branch plan/<id>,
#            whose commit message is the summary shown in the admin panel; the uploaded file is then deleted
#   publish: the plans of branches plan/<id> (several ids and keys, comma-separated) go into main (and the UAT's entry in the locator list), then the deploy
#            (when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set)
name: Plan cadastral
run-name: plan ${{ inputs.mode }} ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      mode: { description: "convert | publish", required: true, type: string }
      id: { description: "plan upload id (publish: several, comma-separated)", required: true, type: string }
      key: { description: "UAT key (publish: several, comma-separated)", required: true, type: string }
      name: { description: "UAT name (new UAT only)", required: false, type: string, default: "" }
      county: { description: "county (new UAT only)", required: false, type: string, default: "" }
      asset: { description: "release asset id (convert)", required: false, type: string, default: "" }

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Conversions run side by side (each into its own branch). Only publications wait for one another: they push to the
    # same branch. (A single shared group made GitHub cancel every waiting conversion but the last one.)
    concurrency:
      group: ${{ inputs.mode == 'publish' && 'plans-publish' || format('plan-convert-{0}', inputs.id) }}
      cancel-in-progress: false
    env:
      MODE: ${{ inputs.mode }}
      ID: ${{ inputs.id }}
      KEY: ${{ inputs.key }}
      NAME: ${{ inputs.name }}
      COUNTY: ${{ inputs.county }}
      ASSET: ${{ inputs.asset }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$MODE" == convert || "$MODE" == publish ]]
          [[ "$ID" =~ ^[a-f0-9]{8}(,[a-f0-9]{8})*$ ]]
          [[ "$KEY" =~ ^[a-z]+(-[a-z]+)*(,[a-z]+(-[a-z]+)*)*$ ]]
          [[ "$MODE" == publish || ( "$ASSET" =~ ^[0-9]+$ && "$ID" != *,* && "$KEY" != *,* ) ]]
          [[ -z "$NAME" || -n "$COUNTY" ]]

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install --quiet ezdxf shapely pyproj

      - name: Convert
        if: inputs.mode == 'convert'
        run: |
          set -euo pipefail
          # started twice: the first run has already converted the file (and deleted it)
          if git ls-remote --exit-code --heads origin "plan/$ID" > /dev/null; then echo "Deja convertit: plan/$ID."; exit 0; fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/$ASSET" -o "$RUNNER_TEMP/plan.dxf.gz"
          gunzip "$RUNNER_TEMP/plan.dxf.gz"
          if [[ -n "$NAME" ]]; then
            SUMMARY_FILE="$RUNNER_TEMP/summary.txt" python3 tools/dxf/convert.py "$RUNNER_TEMP/plan.dxf" "$KEY" "$NAME" "$COUNTY"
          else
            SUMMARY_FILE="$RUNNER_TEMP/summary.txt" python3 tools/dxf/convert.py "$RUNNER_TEMP/plan.dxf" "$KEY"
          fi
          git config user.name "VALUEFY Tools"
          git config user.email "tools@valuefy.ro"
          git checkout -b "plan/$ID"
          git add localizare-data
          { printf 'Plan cadastral %s din DXF (încărcat din admin)\n\n' "$KEY"; cat "$RUNNER_TEMP/summary.txt"; } > "$RUNNER_TEMP/msg.txt"
          git commit -q --allow-empty -F "$RUNNER_TEMP/msg.txt"
          git push -f origin "plan/$ID"
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/assets/$ASSET" || true

      - name: Publish
        if: inputs.mode == 'publish'
        run: |
          set -euo pipefail
          IFS=, read -ra IDS <<< "$ID"
          IFS=, read -ra KEYS <<< "$KEY"
          [[ ${#IDS[@]} == ${#KEYS[@]} ]]
          printf 'Planuri cadastrale publicate din admin: %s\n\n' "${KEYS[*]}" > "$RUNNER_TEMP/msg.txt"
          for b in "${IDS[@]}"; do
            git fetch -q origin "+refs/heads/plan/$b:refs/plans/$b"
            git log -1 --format=%B "refs/plans/$b" | tail -n +3 >> "$RUNNER_TEMP/msg.txt"
          done
          git config user.name "VALUEFY Tools"
          git config user.email "tools@valuefy.ro"
          # Always on top of the latest branch: the checkout is the branch as it was when the run was started, and another
          # publication may have pushed meanwhile. When the push is refused the plans are applied again on the new head
          # instead of rebasing: two publications both rewrite the list of localities in index.html and would conflict.
          for try in 1 2 3 4 5; do
            git fetch -q origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            for i in "${!IDS[@]}"; do
              git checkout "refs/plans/${IDS[$i]}" -- "localizare-data/${KEYS[$i]}.json"
              python3 tools/dxf/convert.py --entry "${KEYS[$i]}"
            done
            git add localizare-data
            git commit -q -F "$RUNNER_TEMP/msg.txt" || echo "nimic nou de publicat"
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            [[ $try == 5 ]] && exit 1
            sleep $((try * 3))
          done
          for b in "${IDS[@]}"; do git push -q origin --delete "plan/$b" || true; done

      - uses: actions/setup-node@v4
        if: inputs.mode == 'publish' && env.HAS_CF == 'true'
        with: { node-version: 22, cache: npm }

      - name: Deploy
        if: inputs.mode == 'publish' && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm run cf:deploy
