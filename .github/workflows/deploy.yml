# Checks and deploys UVALO to Cloudflare.
#   pull request        → check only (types + the Cloudflare build), no deploy
#   push to "staging"   → staging     (worker tools-staging, D1 valuefy-tools-staging-db, R2 uvalo-inspectii-staging)
#   manual (Run workflow) or the "Plan cadastral" workflow after publishing plans → the chosen environment
#   production (worker tools) is still published by Cloudflare Workers Builds at every push to "main"; from here only
#   by hand (Run workflow → production, from main), after approval in the "production" environment
# Order: types → build → D1 migrations → deploy, so a failed build never leaves a migrated database behind.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and R2: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
run-name: "${{ github.event_name == 'pull_request' && format('Verificare PR {0}', github.event.number) || format('Deploy {0} din {1}', github.event_name == 'workflow_dispatch' && inputs.environment || 'staging', github.ref_name) }}"

on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Mediul"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run cf:build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the target
        run: |
          [[ "$TARGET" == staging || "$TARGET" == production ]]
          # production only from main
          [[ "$TARGET" == staging || "$GITHUB_REF_NAME" == main ]] || { echo "Producția se publică doar din main."; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Lipsesc secretele CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (GitHub → Settings → Secrets and variables → Actions)."; exit 1; }
          if [[ "$TARGET" == staging ]]; then echo "ENV_FLAG=--env staging" >> "$GITHUB_ENV"; echo "DB_NAME=valuefy-tools-staging-db" >> "$GITHUB_ENV"; echo "R2_BUCKET=uvalo-inspectii-staging" >> "$GITHUB_ENV";
          else echo "ENV_FLAG=" >> "$GITHUB_ENV"; echo "DB_NAME=valuefy-tools-db" >> "$GITHUB_ENV"; echo "R2_BUCKET=uvalo-inspectii" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Types
        run: npx tsc --noEmit

      - name: Build (OpenNext + locator data)
        run: npm run cf:build

      - name: D1 migrations and R2 bucket
        run: |
          npx wrangler d1 create "$DB_NAME" > /dev/null 2>&1 || true   # the first deploy of an environment creates its database
          npx wrangler r2 bucket create "$R2_BUCKET" > /dev/null 2>&1 || true   # … and its bucket for the Inspecții files
          npx wrangler d1 migrations apply DB --remote $ENV_FLAG

      - name: Deploy
        run: npx opennextjs-cloudflare deploy $ENV_FLAG
