# Checks and deploys VALUEFY Tools to Cloudflare.
#   pull request        → check only (types + the Cloudflare build), no deploy
#   push to "staging"   → staging     (worker tools-staging, D1 valuefy-tools-staging-db)
#   push to "main"      → production  (worker tools, D1 valuefy-tools-db), after approval in the "production" environment
#   manual (Run workflow) or the "Plan cadastral" workflow after publishing plans → the chosen environment
# Order: types → build → D1 migrations → deploy, so a failed build never leaves a migrated database behind.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
run-name: ${{ github.event_name == 'pull_request' && format('Verificare PR #{0}', github.event.number) || format('Deploy {0} · {1}', github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging'), github.ref_name) }}

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Mediul"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run cf:build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the target
        run: |
          [[ "$TARGET" == staging || "$TARGET" == production ]]
          # production only from main
          [[ "$TARGET" == staging || "$GITHUB_REF_NAME" == main ]] || { echo "Producția se publică doar din main."; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Lipsesc secretele CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          if [[ "$TARGET" == staging ]]; then echo "ENV_FLAG=--env staging" >> "$GITHUB_ENV"; echo "DB_NAME=valuefy-tools-staging-db" >> "$GITHUB_ENV";
          else echo "ENV_FLAG=" >> "$GITHUB_ENV"; echo "DB_NAME=valuefy-tools-db" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Types
        run: npx tsc --noEmit

      - name: Build (OpenNext + locator data)
        run: npm run cf:build

      - name: D1 migrations
        run: |
          npx wrangler d1 create "$DB_NAME" > /dev/null 2>&1 || true   # the first deploy of an environment creates its database
          npx wrangler d1 migrations apply DB --remote $ENV_FLAG

      - name: Deploy
        run: npx opennextjs-cloudflare deploy $ENV_FLAG
