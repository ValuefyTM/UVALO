<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Editare pagini captură</title>
  <style>
    :root { --ink:#141414; --amber:#E0AD4F; --red:#d64545; }
    body {
      margin: 0;
      background: #1e1e1e;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      color: #e8ebee;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--ink);
      padding: 10px 16px;
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header .meta { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 2px; }
    header strong { font-size: 14px; }
    header a { color: var(--amber); word-break: break-all; font-size: 12px; }
    header .stamp {
      background: var(--amber);
      color: var(--ink);
      font-weight: 700;
      border-radius: 3px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-undo {
      border: 1px solid #4a4a4a;
      background: transparent;
      color: #e8ebee;
      border-radius: 6px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-undo:hover { border-color: var(--amber); color: var(--amber); }
    .btn-undo:disabled { opacity: 0.35; cursor: default; }
    header .hint { flex-basis: 100%; font-size: 12px; color: #aab4bf; }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      padding: 16px;
      max-width: 1500px;
      margin: 0 auto;
    }
    .page {
      position: relative;
      background: #1d242c;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
      animation: pop 0.15s ease;
    }
    @keyframes pop { from { transform: scale(0.97); opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) { .page { animation: none; } }
    .page img {
      display: block;
      width: 100%;
      aspect-ratio: 698 / 1005;
      object-fit: cover;
      object-position: top;
      background: #fff;
      cursor: zoom-in;
    }
    .page .label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(32,43,56,0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      pointer-events: none;
    }
    .page .del {
      position: absolute;
      top: 6px;
      right: 6px;
      border: none;
      border-radius: 5px;
      background: var(--red);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      width: 30px;
      height: 30px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .page .del:hover { filter: brightness(1.15); transform: scale(1.06); }
    .page .del:focus-visible { outline: 2px solid var(--amber); }

    .msg { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #aab4bf; }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15,19,24,0.92);
      display: none;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      z-index: 50;
      cursor: zoom-out;
      padding: 24px;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      width: min(900px, 96vw);
      background: #fff;
      box-shadow: 0 6px 30px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <header>
    <div class="meta" id="meta"><strong>Editare pagini</strong></div>
    <span class="stamp" id="stamp"></span>
    <button class="btn-undo" id="btnUndo" disabled>↩ Anulează ștergerea</button>
    <span class="hint">Click pe 🗑 șterge pagina instant (fără confirmare) · click pe imagine o mărește · paginile rămase intră în Word exact în această ordine.</span>
  </header>
  <main id="pages"><div class="msg">Se încarcă…</div></main>
  <div id="lightbox"><img id="lightboxImg" alt="Pagină mărită" /></div>
  <script src="viewer.js"></script>
</body>
</html>
